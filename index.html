<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>XiaoYiY626</title>
  <style>
    :root {
      --ink: #3a3a5e;
      --muted: #8a8ab0;
      --soft: #b6b6d0;
      --accent: #1a73e8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: var(--ink);
      background-color: #d8d4e6;
    }
    /* 固定定位 img 充当全屏背景，referrerPolicy 由 HTML 属性保证，
       避免 CSS background-image 在部分 webview 里不遵守 meta referrer 的问题 */
    .bg-img {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      pointer-events: none;
      /* 本地兜底：远程图加载前/失败时显示 */
      background: url('./assets/bg-original.png') center / cover no-repeat #d8d4e6;
      transition: opacity .6s ease-in-out;
    }
    .container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 600px;
      padding: 40px 36px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 16px 64px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .cat {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin-bottom: 6px;
      display: inline-block;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 16px rgba(120, 100, 180, 0.18);
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .host-card {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #f6d5f7, #c2e9fb);
      border-radius: 20px;
      font-size: 18px;
      font-weight: 600;
      color: #5a5a8a;
      word-break: break-all;
      box-shadow: 0 4px 16px rgba(160, 140, 200, 0.12);
    }
    .info {
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.8;
    }
    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--soft);
    }
    .bg-credit {
      position: fixed;
      right: 12px;
      bottom: 10px;
      font-size: 11px;
      color: rgba(60, 60, 90, 0.55);
      background: rgba(255, 255, 255, 0.45);
      padding: 4px 10px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 2;
      max-width: calc(100vw - 24px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <img id="bgImg" class="bg-img" referrerPolicy="no-referrer" alt="" />
  <div class="container">
    <img class="cat" id="inuAvatar" src="./assets/xiaoyiy626-qq.jpg" alt="XiaoYiY626" />
    <h1>XiaoYiY626</h1>
    <p class="subtitle">欢迎你 · XiaoYiY626 收藏的访问入口</p>
    <div class="host-card" id="hostDisplay">%host%</div>
    <div class="info">当前通过 XiaoYiY626 顺手收藏的域名访问</div>
    <div class="footer">Powered by XiaoYiY626</div>
  </div>

  <div class="bg-credit" id="bgCredit"></div>

  <!-- 同步当前访问的域名 -->
  <script>
    document.getElementById('hostDisplay').textContent = window.location.host || '%host%';
  </script>

  <!-- 随机壁纸：拾光 API pixiv 通道（动漫图），每次刷新或点击换一张 -->
  <script>
    (function () {
      'use strict';
      // 拾光 API 的 pixiv 通道：全是动漫插画/漫画
      // JSON 端点：返回 data.imgurl / data.title / data.copyright
      const JSON_URL = 'https://api.nguaduot.cn/pixiv/random?json=1';
      // 直链：浏览器直接 302 跳转加载图片
      const DIRECT_URL = 'https://api.nguaduot.cn/pixiv/random';

      const body = document.body;
      const creditEl = document.getElementById('bgCredit');
      const bgImg = document.getElementById('bgImg');

      let currentUrl = '';
      let currentCredit = '拾光 · Pixiv';
      let loading = false;
      // 图片加载失败时的重试次数（避免死链图卡住背景）
      let bgRetries = 0;
      const MAX_BG_RETRIES = 6;

      function setBackground(url, credit) {
        if (!url) return;
        // 直接设置可见 img 的 src，只发一次请求；
        // referrerPolicy="no-referrer" 由 HTML 属性保证，对所有 webview 都生效。
        // 之前用 CSS background-image 会导致浏览器发第二次请求（URL 还不带缓存破坏参数），
        // 那次请求不继承 JS Image 的 referrerPolicy，在部分 webview 里被防盗链拦截。
        const fullUrl = url + (url.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now();
        bgImg.onload = function () {
          currentUrl = url;
          if (typeof credit === 'string' && credit.trim()) {
            currentCredit = credit;
          } else {
            currentCredit = '拾光 · Pixiv';
          }
          creditEl.textContent = `背景：${currentCredit}`;
          // 成功后重置重试计数
          bgRetries = 0;
        };
        bgImg.onerror = function () {
          console.warn('[bg] image load failed:', url);
          // 该图死链/防盗链：换一张再试，最多重试 MAX_BG_RETRIES 次，仍失败则保留默认背景
          if (bgRetries < MAX_BG_RETRIES) {
            bgRetries++;
            console.warn('[bg] retrying, attempt', bgRetries);
            // 强制释放 loading，确保重试不会被吞
            loading = false;
            fetchRandom(true);
          } else {
            console.warn('[bg] retries exhausted, keep default background');
          }
        };
        bgImg.src = fullUrl;
      }

      // isRetry=true 表示这是一次图片加载失败触发的重试，不要被 loading 闸门拦住
      async function fetchRandom(isRetry) {
        if (loading) return;
        loading = true;
        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 6000);
          const r = await fetch(JSON_URL, { signal: ctrl.signal, cache: 'no-store' });
          clearTimeout(t);
          if (!r.ok) throw new Error('not ok');
          const j = await r.json();
          if (!j || j.status !== 1) throw new Error('bad status');
          const d = j.data || {};
          if (!d.imgurl) throw new Error('no imgurl');
          const title = d.title || '';
          const author = d.copyright || d.copyrightrich || '';
          const credit = (title && author) ? `${title} · @${author}` :
                         (title || author || '拾光 · Pixiv');
          setBackground(d.imgurl, credit);
        } catch (e) {
          console.warn('[bg] json fetch failed, fallback to direct:', e.message);
          // JSON 拉取失败时才回退直链；重试中不再重复回退，交给 onerror 重试机制
          if (!isRetry) {
            setBackground(DIRECT_URL, '拾光 · Pixiv');
          }
        } finally {
          loading = false;
        }
      }

      // 首屏立刻拉一张
      fetchRandom(false);

      // 点击背景时换一张
      body.addEventListener('click', function (e) {
        if (e.target.closest('.container') || e.target.closest('.mynet-bar')) return;
        fetchRandom(false);
      });

      // 每 10 分钟自动换一张
      setInterval(fetchRandom, 10 * 60 * 1000, false);
    })();
  </script>

  <!-- 自有 IP + 测速浮窗（顶部+底部 共享单脚本，无 ID 冲突） -->
  <script src="./assets/mynet.js?v=20260724b" defer></script>
</body>
</html>
